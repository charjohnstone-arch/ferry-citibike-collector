name: Collect ferry and Citi Bike data

on:
  schedule:
    - cron: "*/30 * * * *"   # backup only; each run starts the next one itself
  workflow_dispatch:         # lets you (or the previous run) start a run

# One run at a time. A run started while another is going waits its turn.
concurrency:
  group: collector
  cancel-in-progress: false

permissions:
  contents: write   # save data to the repo
  actions: write    # start the next run

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Start the next run (it waits until this one finishes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --ref ${{ github.ref_name }} -R ${{ github.repository }}

      - name: Poll feeds
        env:
          MTA_BUSTIME_KEY: ${{ secrets.MTA_BUSTIME_KEY }}
          RUN_MINUTES: "50"
        run: python collect.py

      - name: Save data to the repository
        run: |
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data $(TZ=America/New_York date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep 10; done
          exit 1
