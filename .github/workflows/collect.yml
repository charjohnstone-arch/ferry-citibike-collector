name: Collect ferry and Citi Bike data

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub's minimum; runs can start a few minutes late
  workflow_dispatch:        # lets you start a run by hand from the Actions tab

# One run at a time. A run that starts while another is going waits its turn,
# which fills the gaps when GitHub starts runs late.
concurrency:
  group: collector
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Poll feeds for 9 minutes
        env:
          MTA_BUSTIME_KEY: ${{ secrets.MTA_BUSTIME_KEY }}
        run: python collect.py

      - name: Save data to the repository
        run: |
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data $(TZ=America/New_York date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
